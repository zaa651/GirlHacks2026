<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mossling — a night-forest scrapbook pet</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--night1:#0c1424;--night2:#16283a;--moss:#7fae7a;--paper:#f3e9d2;--paper2:#e8d9b8;--ink:#3b2f2a;--dew:#7fd6e8;--glow:#ffe98a;--rose:#e58a8a;--tape:rgba(229,138,138,.65);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,var(--night1),var(--night2) 70%,#1d3a33);color:var(--ink);font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:18px;overflow-x:hidden;cursor:none}
body *{cursor:none!important}
@media (hover:none){body,body *{cursor:auto!important}#cursor{display:none}}
h1,h2,h3{font-family:'Caveat','Brush Script MT',cursive;margin:0;font-weight:700}
canvas#flies{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.trees{position:fixed;left:0;right:0;bottom:0;height:45vh;z-index:0;pointer-events:none}
#cursor{position:fixed;left:0;top:0;width:14px;height:14px;z-index:9999;pointer-events:none;transform:translate(-50%,-50%)}
#cursor i{position:absolute;inset:0;border-radius:50%;background:var(--glow);box-shadow:0 0 10px 4px var(--glow),0 0 28px 10px rgba(255,233,138,.45);animation:pulse 1.6s ease-in-out infinite}
#cursor b{position:absolute;top:-3px;width:11px;height:6px;background:rgba(255,255,255,.7);border-radius:50%;animation:flap .18s infinite alternate}
#cursor b:nth-child(2){left:-9px;transform-origin:right;transform:rotate(-25deg)}
#cursor b:nth-child(3){right:-9px;transform-origin:left;transform:rotate(25deg);animation-delay:.09s}
@keyframes flap{to{transform:rotate(0) scaleY(.4)}}
@keyframes pulse{50%{opacity:.7;box-shadow:0 0 6px 2px var(--glow),0 0 18px 6px rgba(255,233,138,.3)}}
.trail{position:fixed;width:5px;height:5px;border-radius:50%;background:var(--glow);pointer-events:none;z-index:9998;box-shadow:0 0 8px var(--glow);animation:fade .8s forwards}
@keyframes fade{to{opacity:0;transform:translateY(8px) scale(.2)}}

.page{position:relative;z-index:1;min-height:100vh;padding:20px}
#login{display:flex;align-items:center;justify-content:center;transition:transform .9s cubic-bezier(.6,-.2,.4,1.1),opacity .9s}
#login.leave{transform:translateY(-120%) rotate(-14deg);opacity:0;pointer-events:none}
#game{display:none;opacity:0;transform:scale(.96);transition:opacity .9s,transform .9s}
#game.show{opacity:1;transform:none}

.paper{background:var(--paper);background-image:repeating-linear-gradient(transparent 0 27px,rgba(120,150,170,.18) 27px 28px);border-radius:4px 10px 5px 9px;box-shadow:2px 6px 0 rgba(0,0,0,.28),0 14px 30px rgba(0,0,0,.35);padding:22px 22px 18px;position:relative}
.paper::before{content:"";position:absolute;top:-13px;left:50%;width:92px;height:26px;margin-left:-46px;background:var(--tape);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.2);clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,100% 0,96% 50%,100% 100%,8% 100%,4% 90%,0 100%,3% 50%)}
.paper.t2::before{background:rgba(127,214,232,.6);transform:rotate(4deg)}
.paper.t3::before{background:rgba(255,233,138,.7);transform:rotate(-6deg)}
.card{width:min(380px,100%);transform:rotate(-2deg)}
.card h1{font-size:54px;line-height:1}
.card p{margin:8px 0 16px}
input[type=text],input[type=password],textarea{width:100%;font:inherit;padding:8px 10px;border:2px dashed #a58f6a;background:rgba(255,255,255,.55);border-radius:6px;color:var(--ink)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--moss);outline-offset:2px}
button{font:inherit;font-family:'Caveat',cursive;font-weight:700;font-size:22px;border:2px solid var(--ink);background:var(--moss);color:#18321a;border-radius:8px 14px 8px 12px;padding:5px 16px;box-shadow:2px 3px 0 var(--ink);transition:transform .12s}
button:hover{transform:translate(-1px,-2px) rotate(-1deg)}
button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
button.alt{background:var(--paper2)}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;margin-top:10px}
.stamp{display:inline-block;border:3px double var(--rose);color:var(--rose);padding:0 10px;border-radius:6px;transform:rotate(-5deg);font-family:'Caveat',cursive;font-size:22px}

.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:34px 26px;max-width:1100px;margin:0 auto;padding-top:20px}
.topbar{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;color:var(--paper);gap:10px;flex-wrap:wrap}
.topbar h2{font-size:38px;text-shadow:0 0 12px var(--glow)}
.dew{background:var(--paper);color:var(--ink);border-radius:30px;padding:2px 16px;font-size:24px;font-family:'Caveat',cursive;font-weight:700;box-shadow:2px 3px 0 rgba(0,0,0,.35)}
.dew span{color:#2a8fa6}
.polaroid{background:#fff;padding:12px 12px 8px;box-shadow:2px 4px 0 rgba(0,0,0,.2);transform:rotate(1.5deg);text-align:center;margin-bottom:12px;border-radius:2px}
.view{background:radial-gradient(circle at 50% 60%,#27475a,#13222f);height:240px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.view .ground{position:absolute;bottom:0;left:0;right:0;height:28px;background:#2b4a34;border-top:3px dotted #5c8c5a}
#pet{width:215px;position:relative;z-index:1;margin-bottom:6px;overflow:visible}
#pet .gbody{transform-origin:400px 1430px;animation:breathe 3.4s ease-in-out infinite}
#pet .ghead{transform-origin:400px 920px;animation:headbob 3.4s ease-in-out infinite}
#pet .gleaf{transform-origin:385px 385px;animation:leaf 2.9s ease-in-out infinite}
#pet .gtail{transform-origin:745px 1160px;animation:tail 2.3s ease-in-out infinite}
#pet .lid{transform-box:fill-box;transform-origin:50% 0%;animation:lid 4.6s infinite}
#pet .lid.r{animation-delay:.04s}
#pet .xx{opacity:0}
@keyframes breathe{50%{transform:scale(1.012,.988)}}
@keyframes headbob{50%{transform:translateY(16px) rotate(-1.4deg)}}
@keyframes leaf{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes tail{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(7deg)}}
@keyframes lid{0%,91%,100%{transform:scaleY(.02);opacity:0}95%{transform:scaleY(1);opacity:1}}
@keyframes shiver{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes sickhead{0%,100%{transform:translateY(24px) rotate(-5deg)}50%{transform:translateY(32px) rotate(-6deg)}}
@keyframes hop{40%{transform:translateY(-40px) rotate(4deg)}}
#pet.sick{filter:hue-rotate(40deg) saturate(.6) brightness(.95);animation:shiver .5s infinite}
#pet.sick .lid{animation:none;transform:scaleY(.75);opacity:1}
#pet.sick .ghead{animation:sickhead 2.4s ease-in-out infinite}
#pet.sick .gleaf{animation:none;transform:rotate(-28deg)}
#pet.dead{filter:grayscale(1) brightness(.85);opacity:.7}
#pet.dead *{animation:none!important}
#pet.dead .lid{transform:scaleY(1);opacity:1}
#pet.dead .xx{opacity:1}
#pet.dead .ghead{transform:rotate(-8deg) translateY(30px)}
#pet.dead .gleaf{transform:rotate(-40deg)}
#pet.hop{animation:hop .6s}
.fx{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:34px;z-index:2;animation:float 2.2s ease-in-out infinite}
.fx:empty{display:none}
@keyframes float{50%{transform:translate(-50%,-8px)}}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.days{display:flex;gap:8px;margin:10px 0}
.dot{width:34px;height:34px;border-radius:50%;border:2px dashed #a58f6a;display:grid;place-items:center;font-size:18px}
.dot.on{border:2px solid var(--moss);background:#d4efc6}
.dot.today{outline:3px solid var(--rose);outline-offset:1px}
details summary{margin-top:10px}
.bar{height:16px;border:2px solid var(--ink);border-radius:10px;background:rgba(255,255,255,.6);overflow:hidden;margin:4px 0 10px}
.bar>div{height:100%;background:repeating-linear-gradient(45deg,var(--moss) 0 8px,#93c48d 8px 16px);transition:width .6s}
.mood{font-size:20px}
ul{list-style:none;margin:10px 0 0;padding:0}
.task{display:flex;align-items:center;gap:8px;padding:4px 0;line-height:28px}
.task.done .txt{text-decoration:line-through wavy var(--rose);opacity:.6}
.task .txt{flex:1}
.task button{font-size:18px;padding:0 10px;box-shadow:1px 2px 0 var(--ink)}
.note{margin-top:12px;background:#fff6a8;padding:12px;border-radius:3px;box-shadow:2px 3px 0 rgba(0,0,0,.25);transform:rotate(-1deg);display:none}
.note.open{display:block}
.msg{margin-top:6px;min-height:24px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;margin-top:10px}
.item{background:#fff;padding:8px 6px;text-align:center;border-radius:3px;box-shadow:1px 3px 0 rgba(0,0,0,.22);transform:rotate(var(--r,0deg))}
.item svg{width:64px;height:48px}
.item small{display:block;font-size:15px}
.item button{font-size:17px;padding:0 8px;margin-top:3px;box-shadow:1px 2px 0 var(--ink)}
.item.on{outline:3px dashed var(--moss)}
.hint{font-size:15px;opacity:.75}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,40px);background:var(--paper);padding:6px 20px;border-radius:30px;font-family:'Caveat',cursive;font-size:26px;font-weight:700;box-shadow:2px 4px 0 rgba(0,0,0,.4);opacity:0;transition:.4s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#game.page{position:fixed;inset:0;padding:0;min-height:0;overflow:hidden}
h3{font-size:26px;margin:14px 0 2px}
.hud{position:absolute;z-index:5;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75)}
.tl{top:max(14px,env(safe-area-inset-top));left:14px;width:min(290px,64vw)}
.tl .top{display:flex;gap:10px;align-items:center}
.ring{--p:0;width:92px;height:92px;flex:none;border-radius:50%;background:conic-gradient(var(--glow) calc(var(--p)*1%),rgba(255,255,255,.2) 0);display:grid;place-items:center;box-shadow:0 0 0 4px rgba(243,233,210,.9),0 6px 14px rgba(0,0,0,.45);position:relative}
.ring.met{background:conic-gradient(#9be08f calc(var(--p)*1%),rgba(255,255,255,.2) 0)}
.ring::after{content:"";position:absolute;bottom:-5px;left:50%;width:3px;height:12px;margin-left:-1px;background:var(--rose)}
.ringin{width:72px;height:72px;border-radius:50%;background:radial-gradient(#2c5266,#13222f);display:grid;place-items:center;text-align:center;line-height:1;font-family:'Caveat',cursive;font-size:28px}
.ringin small{font-family:'Patrick Hand',cursive;font-size:14px;opacity:.85}
.needs{flex:1;font-size:16px;line-height:1.15}
.needs .bar{margin:2px 0 5px;height:12px}
.quest{margin-top:14px;font-size:19px;line-height:1.2}
.qline{height:3px;background:rgba(255,255,255,.3);margin-top:5px}.qline>div{height:100%;width:0;background:linear-gradient(90deg,#f2d27a,#fff);transition:width .6s}
.tr{top:max(14px,env(safe-area-inset-top));right:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:58vw}
.ico,.act{position:relative;width:46px;height:46px;border-radius:50%;padding:0;font-size:22px;background:var(--paper);border:2px dashed #a58f6a;box-shadow:2px 3px 0 rgba(0,0,0,.45);display:grid;place-items:center}
.ico:nth-child(odd){transform:rotate(-3deg)}.ico:nth-child(even){transform:rotate(3deg)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;font:700 12px/18px sans-serif;padding:0 4px;text-shadow:none}
.dewchip{position:absolute;z-index:5;right:14px;top:calc(max(14px,env(safe-area-inset-top)) + 112px);background:var(--paper);color:var(--ink);padding:0 14px;border-radius:20px;font-family:'Caveat',cursive;font-size:24px;font-weight:700;box-shadow:2px 3px 0 rgba(0,0,0,.4)}
.dewchip span{color:#2a8fa6}
.stage{position:absolute;left:50%;bottom:9vh;transform:translateX(-50%);z-index:3;width:min(340px,78vw);text-align:center}
.stage #pet{width:100%;margin:0;display:block}
.stage .fx{left:auto;right:6%;top:6%;transform:none;animation:float2 2.2s ease-in-out infinite}
@keyframes float2{50%{transform:translateY(-8px)}}
#pet .glook{transform-origin:400px 920px;transition:transform .35s ease-out}
.shadow{position:absolute;left:18%;right:18%;bottom:-6px;height:26px;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(5px);z-index:-1}
.plate{margin:8px auto 0;width:210px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);font-size:20px;line-height:1.1}
.plate .bar{height:8px;margin:3px 0;border-width:1px}
.bubble{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:3px 14px;border-radius:14px;font-size:19px;white-space:nowrap;box-shadow:2px 3px 0 rgba(0,0,0,.35);opacity:0;transition:opacity .3s;z-index:4;pointer-events:none}
.bubble.on{opacity:1}
.heart{position:absolute;bottom:50%;font-size:26px;animation:rise 1.6s forwards;pointer-events:none;z-index:4}
@keyframes rise{to{transform:translateY(-130px);opacity:0}}
.br{bottom:max(22px,env(safe-area-inset-bottom));right:18px;display:flex;flex-direction:column;gap:12px}
.act{width:58px;height:58px;font-size:28px}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,10,25,.55);z-index:20;padding:16px}
.modal.open{display:flex}
.sheet{width:min(580px,100%);transform:rotate(-.5deg)}
.sbody{max-height:70vh;overflow:auto;padding-right:4px}
.x{position:absolute;top:8px;right:10px;font-size:20px;padding:0 10px;box-shadow:1px 2px 0 var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;margin-top:8px}
.big{font-size:38px;line-height:48px}
.sheet .note{margin-top:8px}
@media (max-width:520px){.stage{bottom:15vh}.ring{width:76px;height:76px}.ringin{width:58px;height:58px;font-size:22px}}
#pet[data-ex=happy] [data-e=happy]{opacity:1}#pet[data-ex=excited] [data-e=excited]{opacity:1}#pet[data-ex=sick] [data-e=sick]{opacity:1}#pet[data-ex=sad] [data-e=sad]{opacity:1}#pet[data-ex=sleepy] [data-e=sleepy]{opacity:1}
:root{--base:max(150px,18vh)}
#pet .ex{opacity:0;transition:opacity .35s}
#pet:not([data-ex=neutral]):not([data-ex=dead]) .lid{opacity:0!important}
#pet .zz{animation:zz 2.4s ease-in-out infinite}
@keyframes zz{50%{transform:translateY(-16px);opacity:.4}}
.stage{bottom:var(--base);transform-origin:50% 100%;transform:translateX(-50%) scale(var(--sc,1));transition:left var(--mt,2.4s) ease-in-out,bottom var(--mt,2.4s) ease-in-out,transform var(--mt,2.4s) ease-in-out}
.body{position:relative;transition:transform .2s}
.stage #pet{transform-origin:50% 100%}
@keyframes walk{50%{transform:translateY(-16px)}}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes stretch{50%{transform:scale(.93,1.1)}}
@keyframes bounce{50%{transform:translateY(-34px) scale(.97,1.04)}}
@keyframes spin{to{transform:rotateY(360deg)}}
#pet.walk{animation:walk .42s ease-in-out infinite}
#pet.p-wiggle{animation:wiggle .3s 3}
#pet.p-stretch{animation:stretch 1.3s}
#pet.p-bounce{animation:bounce .5s 3}
#pet.p-spin{animation:spin .9s}
.ico,.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:60px;height:64px;border-radius:16px;padding:4px 0 2px}
.act{width:62px;height:70px}
.ico span:first-child,.act span:first-child{font-size:24px;line-height:1.1}
.ico small,.act small{font-size:15px;line-height:1;color:var(--ink);font-family:'Caveat',cursive;font-weight:700;text-shadow:none}
.tr{max-width:64vw}
.dewchip{top:auto;right:auto;left:14px;bottom:max(22px,env(safe-area-inset-bottom))}
#bond{font-size:16px;line-height:1.2;letter-spacing:2px}
#pname{cursor:pointer;border-bottom:2px dashed rgba(255,255,255,.5)}
.dialog{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));width:min(560px,calc(100vw - 120px));min-height:68px;transform:translateX(-50%) translateY(10px);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:8px 16px 8px 14px;padding:16px 36px 12px 16px;font-size:21px;line-height:1.25;box-shadow:3px 5px 0 rgba(0,0,0,.4);z-index:25;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
.dialog.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.dialog .tab{position:absolute;top:-17px;left:14px;background:var(--moss);color:#18321a;border:2px solid var(--ink);border-radius:8px;padding:0 12px;font-family:'Caveat',cursive;font-weight:700;font-size:22px}
.dialog i{position:absolute;right:12px;bottom:8px;font-style:normal;color:var(--rose);animation:pulse .9s infinite}
@media (max-width:520px){:root{--base:max(200px,25vh)}.dialog{left:14px;transform:translateY(10px);width:calc(100vw - 112px)}.dialog.on{transform:none}.tr{max-width:68vw}}

body{font-size:21px}
#leaves{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
body[data-phase=night] #leaves{filter:brightness(.55) saturate(.8)}body[data-phase=dusk] #leaves{filter:brightness(.8)}
.leaf{position:absolute;pointer-events:auto;transform-origin:50% 100%;transform:rotate(var(--r))}
.leaf svg{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.leaf:hover{animation:rustle .9s ease-in-out}
@keyframes rustle{0%,100%{transform:rotate(var(--r))}20%{transform:rotate(calc(var(--r) + 14deg))}40%{transform:rotate(calc(var(--r) - 12deg))}60%{transform:rotate(calc(var(--r) + 8deg))}80%{transform:rotate(calc(var(--r) - 4deg))}}
#cursor.boost i{transform:scale(2.4);box-shadow:0 0 18px 10px var(--glow),0 0 60px 26px rgba(255,233,138,.7)}
#cursor i{transition:transform .25s}
#game.page,#login.page{pointer-events:none}
#game .hud,#game .stage,#game .modal,#game .dewchip,#game .clock,#game .pad,#login .card{pointer-events:auto}
.mi{width:40px;height:40px;fill:url(#mg);filter:url(#moss) drop-shadow(0 2px 0 rgba(0,0,0,.45))}
.ico,.act{background:radial-gradient(circle at 30% 20%,#5e7a5a,#2b3d30);border:3px solid #17241a;border-radius:20px;width:78px;height:88px;overflow:visible}
.act{width:84px;height:94px}
.ico::before,.act::before{content:"";position:absolute;left:3px;right:3px;top:-6px;height:14px;pointer-events:none;background:radial-gradient(circle at 15% 70%,#8fcf72 0 8px,transparent 9px),radial-gradient(circle at 45% 55%,#7fbf62 0 11px,transparent 12px),radial-gradient(circle at 78% 70%,#9bd97c 0 9px,transparent 10px)}
.ico small,.act small{color:#f3e9d2;font-size:20px;text-shadow:0 1px 2px #000}
.ico span:first-child,.act span:first-child{display:grid;place-items:center}
.ico.off .mi{opacity:.4}
.ico{transform:none!important}.ico:hover,.act:hover{transform:translateY(-3px) rotate(-2deg)!important}
.tr{gap:14px;max-width:62vw}
.ring{width:112px;height:112px}.ringin{width:88px;height:88px;font-size:34px}.needs{font-size:19px}.quest{font-size:23px}.tl{width:min(350px,64vw)}
:root{--base:max(70px,8vh)}
@media (max-width:520px){:root{--base:max(120px,16vh)}}
.stage{width:min(400px,78vw,46vh)}
.stage #pet{margin-left:-23.7%}
.shadow{left:27%;right:27%}
.plate{margin:0 auto 10px;width:270px;font-size:24px}
.stage .fx{top:130px;right:8%}
.stage .dialog{position:absolute;left:50%;bottom:calc(100% + 12px);width:max-content;min-width:150px;max-width:min(330px,86vw);min-height:0;padding:10px 18px;font-size:22px;border-radius:22px 22px 22px 6px;transform:translate(-50%,8px)}
.stage .dialog.on{transform:translate(-50%,0)}
.stage .dialog .tab,.stage .dialog i{display:none}
.stage .dialog::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;background:var(--paper);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.clock{position:absolute;z-index:5;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.75);white-space:nowrap}
#ct{font:700 clamp(56px,7vw,96px)/1 Caveat,cursive}#cd{font-size:clamp(18px,2vw,26px)}
.pad{position:absolute;z-index:5;left:50%;margin-left:-120px;top:calc(max(8px,env(safe-area-inset-top)) + 140px);width:240px;transform:rotate(1.5deg);background:#fff3a0 repeating-linear-gradient(transparent 0 27px,rgba(120,150,170,.35) 27px 28px);padding:30px 14px 12px;border-radius:3px 3px 6px 6px;box-shadow:2px 5px 0 rgba(0,0,0,.3);color:var(--ink);cursor:pointer}
.pad::before{content:"";position:absolute;top:-8px;left:8px;right:8px;height:16px;background:radial-gradient(circle,#5a4a3a 0 4px,transparent 5px) 0 0/22px 16px repeat-x}
.pad b{font:700 28px Caveat,cursive;position:absolute;top:2px;left:14px}
.pad ul{margin:0}.pad li{font-size:20px;line-height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pad li::before{content:"\270E ";color:#a58f6a}
.pad li.d{text-decoration:line-through wavy var(--rose);opacity:.55}.pad li.e{opacity:.5}
@media (max-width:900px){.clock{top:calc(max(14px,env(safe-area-inset-top)) + 150px)}.pad{display:none}}
#grave{position:fixed;inset:0;z-index:60;background:linear-gradient(#848990,#33373c);transform:translateY(100%);transition:transform 1.3s cubic-bezier(.2,.8,.2,1);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;pointer-events:none}
#grave.open{transform:none;pointer-events:auto}
.mound{position:absolute;bottom:0;left:-10%;right:-10%;height:20vh;background:#2a2e32;border-radius:50% 50% 0 0}
.stone{position:relative;z-index:1;width:min(340px,86vw);margin-bottom:10vh;padding:34px 20px 22px;text-align:center;background:linear-gradient(#c3c7cc,#8c9197);border-radius:170px 170px 10px 10px;box-shadow:inset 0 0 0 6px rgba(0,0,0,.12),0 14px 28px rgba(0,0,0,.5);color:#33363b;transform:translateY(140%);transition:transform 1.6s .9s cubic-bezier(.2,.9,.25,1.05)}
#grave.open .stone{transform:none}
.stone h2{font-size:56px;line-height:1}.gn{font:700 36px Caveat,cursive}.gs{font-size:18px;margin:4px 0 10px}
.gp{width:170px;height:auto;display:block;margin:6px auto;filter:grayscale(1) contrast(.9)}
.gp *{animation:none!important}.gp .ex{opacity:0}.gp .xx{opacity:1}

.tree{position:absolute;bottom:-4px;pointer-events:none;opacity:.97}
.tree svg{height:100%;width:100%;overflow:visible;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.tree .can{pointer-events:all;transform-box:fill-box;transform-origin:50% 100%}
.tree .can:hover{animation:crown 1s ease-in-out}
@keyframes crown{0%,100%{transform:rotate(0)}20%{transform:rotate(7deg) translateX(3px)}45%{transform:rotate(-6deg)}70%{transform:rotate(3deg)}}
.bulb{filter:drop-shadow(0 0 5px #ffe98a);animation:tw 2.8s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
body[data-phase=day] .bulb{opacity:.25;animation:none}
@media (max-width:700px){.tree{opacity:.9}.tree:nth-child(n+2){display:none}}

function paintBG(){
  const c = $('bg'), w = c.width = innerWidth, h = c.height = innerHeight, g = c.getContext('2d');
  const o = document.createElement('canvas'); o.width = w; o.height = h; const x = o.getContext('2d');
  let seed = 7; const R = () => (seed = seed*16807 % 2147483647)/2147483647;
  const P = PAL[phase()]; FF = P.ff; document.body.dataset.phase = phase(); let gr = x.createLinearGradient(0,0,0,h); gr.addColorStop(0,P.s[0]); gr.addColorStop(.55,P.s[1]); gr.addColorStop(1,P.s[2]);
  x.fillStyle = gr; x.fillRect(0,0,w,h);
  const mx = w*P.o[0], my = h*P.o[1], mr = Math.min(w,h)*P.r;
  const rg = x.createRadialGradient(mx,my,mr*.5,mx,my,mr*5); rg.addColorStop(0,P.g); rg.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle = rg; x.fillRect(0,0,w,h); x.fillStyle = P.c; x.beginPath(); x.arc(mx,my,mr,0,7); x.fill();
  [[P.t[0],.55,.22,.6],[P.t[1],.68,.27,.8],[P.t[2],.82,.33,1]].forEach(([col,base,ht,sc]) => {
    x.fillStyle = col;
    for(let i=0;i<w/(70*sc)+2;i++){ const tx = i*70*sc+R()*40, tb = h*base+R()*h*.08, th = h*ht*(.6+R()*.6), tw = th*.38;
      for(let k=0;k<4;k++){ const y0 = tb-th+k*th*.22, wk = tw*(.35+k*.22); x.beginPath(); x.moveTo(tx,y0); x.lineTo(tx+wk,y0+th*.34); x.lineTo(tx-wk,y0+th*.34); x.fill(); }
      x.fillRect(tx-4,tb-th*.1,8,th*.15+h*.4); } });
  x.fillStyle = P.gr; x.fillRect(0,h*.9,w,h*.1);
  const d = x.getImageData(0,0,w,h).data; g.fillStyle = P.s[0]; g.fillRect(0,0,w,h); g.lineCap = 'round';
  const stroke = (px,py,lw,len) => { const k = (py*w+px)*4, j = () => (R()-.5)*24, a = -.7+Math.sin(px/90)*.4+Math.cos(py/70)*.4;
    g.strokeStyle = `rgba(${d[k]+j()},${d[k+1]+j()},${d[k+2]+j()},.78)`; g.lineWidth = lw; g.beginPath(); g.moveTo(px,py); g.lineTo(px+Math.cos(a)*len,py+Math.sin(a)*len); g.stroke(); };
  const n = Math.min(14000, w*h/60);
  for(let i=0;i<n;i++) stroke(R()*w|0, R()*h|0, 6+R()*9, 12+R()*22);
  for(let i=0;i<n*1.6;i++) stroke(R()*w|0, R()*h|0, 2+R()*3, 6+R()*10);
}

function checkIn(){
  const t = dayNum(); if(S.dead) return '';
  let m = ''; const prev = S.lastDay;
  if(prev==null){ S.streak = 1; m = 'Day 1! Welcome to the forest.'; }
  else { const g = t - prev;
    if(g>7){ S.dead = true; S.streak = 0; return 'Mossling faded away while you were gone.'; }
    if(g>=1){ const y = S.tasks.filter(x => (x.day??prev)===prev), d = y.filter(x => x.done).length;
      S.streak = g===1 ? S.streak+1 : 1; S.food = Math.max(0, S.food-15*(g-1)); m = `Day ${S.streak} streak! +5 dew drops`;
      if(y.length && d/y.length<.5){ S.food = Math.max(0, S.food-20); m = 'Yesterday\'s care goal was missed, so Mossling is extra hungry.'; }
      S.tasks = S.tasks.filter(x => !x.done); S.tasks.forEach(x => x.day = t); }
    if(g>=3){ S.sick = true; m = 'Mossling got sick while you were away. Finish a task or use a tonic.'; }
    if(g===0) m = 'Welcome back!'; }
  if(S.lastDay!==t){ S.dew += 5; S.bond = (S.bond||0)+2; S.hist = (S.hist||[]).concat(t).slice(-14); }
  S.lastDay = t; S.best = Math.max(S.best||0, S.streak); return m;
}

async function verify(task, image){
  const form = new FormData();
  form.append('homework_image', image);
  form.append('task_description', task);
  const base = VERIFICATION_API_URL.replace(/\/+$/, '');
  const response = await fetch(`${base}/verify-task`, {method:'POST',body:form});
  const result = await response.json();
  if(!response.ok) throw new Error(result.detail || 'The verification server could not process this photo.');
  return {ok:result.verified, via:'Gemini', feedback:result.feedback};
}
function complete(t, r){
  const lv0 = 1+Math.floor((S.total||0)/3); t.done = true; S.total = (S.total||0)+1; S.dew += REWARD.dew;
  const was = S.sick; S.sick = false; S.food = Math.min(100, S.food+REWARD.food); hop(); hearts(5); S.lastTask = t.text; addBond(3); setEx('excited',3500); say(`You finished "${t.text}"! I'm so proud of you, ${S.name}!`);
  const lv = 1+Math.floor(S.total/3);
  toast(lv>lv0 ? `Level up! Mossling is now Lv.${lv}` : was ? `Mossling feels better! +${REWARD.dew} dew drops` : `+${REWARD.dew} dew drops, Mossling ate! (${r.via})`);
}

  if(a==='buy'){ const p = ITEMS.find(x => x.id===id); if(S.dew<p.cost) return toast('Not enough dew drops yet'); S.dew -= p.cost; S.owned.push(id); S.eq[p.slot] = id; toast(`${p.name} bought and worn!`); }
  else if(a==='buyf'){ const f = FOOD.find(x => x.id===id); if(S.dew<f.cost) return toast('Not enough dew drops yet'); S.dew -= f.cost; S.inv[id] = (S.inv[id]||0)+1; toast(`${f.name} added to your backpack`); }
  else if(a==='use') return useItem(id);
  else if(a==='eq'){ const p = ITEMS.find(x => x.id===id); if(S.eq[p.slot]===id) delete S.eq[p.slot]; else S.eq[p.slot] = id; }
  else if(a==='add'){ const v = $('tin').value.trim(); if(!v) return; S.tasks.push({id:Date.now(),text:v,done:false,day:dayNum()}); }

// ---- Lofi music (generated live with Web Audio) ----
let AC, master, send, NB, timer, nextT = 0, step = 0, musicOn = false;
const CH = [[57,60,64,67],[53,57,60,64],[50,53,57,60],[52,56,59,62]], PENT = [69,72,74,76,79,81], E = .43;
const mtof = n => 440*2**((n-69)/12);
const tone = (f,t,d,ty,v,snd) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = ty; o.frequency.value = f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(master); if(snd) g.connect(send); o.start(t); o.stop(t+d+.05); };
const hit = (t,d,v,fr,ty) => { const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = NB; f.type = ty; f.frequency.value = fr; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); s.connect(f); f.connect(g); g.connect(master); s.start(t,Math.random()); s.stop(t+d); };
const kick = t => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(42,t+.14); g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.connect(g); g.connect(master); o.start(t); o.stop(t+.25); };
function bar(s,t){ const ch = CH[(s>>3)%4], i = s%8;
  if(i===0){ ch.forEach((n,k) => tone(mtof(n),t+k*.025,3.2,'triangle',.06)); tone(mtof(ch[0]-24),t,1.2,'sine',.24); }
  if(i===4) tone(mtof(ch[0]-24),t,.8,'sine',.2);
  if(i===0||i===5) kick(t); if(i===2||i===6) hit(t,.18,.22,1800,'bandpass'); if(i%2) hit(t,.05,.05,7000,'highpass');
  if(Math.random()<.4) tone(mtof(pick(PENT)),t,.9,'triangle',.07,true); }
function sched(){ while(nextT < AC.currentTime+.2){ bar(step,nextT); nextT += E*(step%2 ? .8 : 1.2); step++; } }
function startMusic(){
  if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = S.vol*.8;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    const dl = AC.createDelay(); dl.delayTime.value = E*1.5; const fb = AC.createGain(); fb.gain.value = .35; dl.connect(fb); fb.connect(dl);
    send = AC.createGain(); send.gain.value = .5; send.connect(dl); dl.connect(lp); master.connect(lp); lp.connect(AC.destination);
    NB = AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const d = NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    const cr = AC.createBufferSource(), cg = AC.createGain(), hp = AC.createBiquadFilter(); cr.buffer = NB; cr.loop = true; cg.gain.value = .012; hp.type = 'highpass'; hp.frequency.value = 3000; cr.connect(hp); hp.connect(cg); cg.connect(master); cr.start(); }
  AC.resume(); nextT = AC.currentTime+.1; if(!timer) timer = setInterval(sched,40); musicOn = true; S.mute = false;
}
function stopMusic(){ clearInterval(timer); timer = null; if(AC) AC.suspend(); musicOn = false; S.mute = true; }
function toggleMusic(){ musicOn ? stopMusic() : startMusic(); save(); render(); }

// ---- Expressions: drawn in the sprite's colors, crossfaded over the baked-in face ----
const FC = '#58a037', DK = '#3d6e26', LE = [208,692], RE = [487,690];
const pat = ([x,y]) => `<ellipse cx="${x}" cy="${y}" rx="118" ry="90" fill="url(#fp)"/>`;
const arc = ([x,y],up) => `<path d="M${x-62} ${y+(up?18:-12)}q62 ${up?-62:62} 124 0" fill="none" stroke="${DK}" stroke-width="15" stroke-linecap="round"/>`;
const eyeO = ([x,y],rx,ry,pr) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" stroke="${FC}" stroke-width="13"/><ellipse cx="${x}" cy="${y+6}" rx="${pr}" ry="${pr*1.1}" fill="${DK}"/><circle cx="${x-pr*.35}" cy="${y-pr*.4}" r="${pr*.35}" fill="#fff"/>`;
const mth = d => `<path d="${d}" fill="none" stroke="${DK}" stroke-width="10" stroke-linecap="round"/>`;
const blush = '<ellipse cx="118" cy="772" rx="46" ry="28" fill="#7fc46a" opacity=".55"/><ellipse cx="578" cy="776" rx="46" ry="28" fill="#7fc46a" opacity=".55"/>';
function faces(){
  const g = (n,c) => `<g class="ex" data-e="${n}">${c}</g>`, P = pat(LE)+pat(RE);
  return '<defs><radialGradient id="fp"><stop offset=".82" stop-color="#d1f0c6"/><stop offset="1" stop-color="#d1f0c6" stop-opacity="0"/></radialGradient></defs>'
  + g('happy', P+arc(LE,1)+arc(RE,1)+mth('M318 836q32 36 64 0')+blush)
  + g('excited', P+eyeO(LE,82,76,44)+eyeO(RE,82,76,44)+`<ellipse cx="350" cy="852" rx="34" ry="28" fill="#fff" stroke="${FC}" stroke-width="10"/><path d="M335 862q15 14 30 0" fill="none" stroke="#e58a8a" stroke-width="8" stroke-linecap="round"/>`+blush)
  + g('sick', P+`<path d="M${LE[0]-60} ${LE[1]-6}l120 22M${RE[0]-60} ${RE[1]+16}l120 -22" stroke="${DK}" stroke-width="15" stroke-linecap="round"/>`+mth('M308 856q21-22 42 0t42 0')+'<path d="M730 560q-26 46 0 62q26-16 0-62z" fill="#8fd6ff" opacity=".9"/>')
  + g('sad', P+eyeO(LE,66,58,30)+eyeO(RE,66,58,30)+`<path d="M${LE[0]-70} ${LE[1]-84}l100 -26M${RE[0]-30} ${RE[1]-110}l100 26" stroke="${DK}" stroke-width="12" stroke-linecap="round"/>`+mth('M316 868q34-34 68 0')+`<path d="M${LE[0]-30} ${LE[1]+60}q-18 36 0 46q18-10 0-46z" fill="#8fd6ff"/>`)
  + g('sleepy', P+arc(LE,0)+arc(RE,0)+mth('M330 846q20 12 40 0')+'<text class="zz" x="600" y="520" font-family="Caveat,cursive" font-size="110" font-weight="700" fill="#fff">z</text><text class="zz" x="680" y="430" font-family="Caveat,cursive" font-size="80" font-weight="700" fill="#fff">z</text>');
}
let exT = null, exTO;
function curEx(){ return S.dead ? 'dead' : S.sick ? 'sick' : exT ? exT : S.food<30 ? 'sad' : S.food>=70 ? 'happy' : 'neutral'; }
function setFace(){ $('pet').dataset.ex = curEx(); }
function setEx(n, ms){ exT = n; clearTimeout(exTO); exTO = setTimeout(() => { exT = null; setFace(); }, ms); setFace(); }

// ---- Dialogue box ----
function say(t){
  t = t.replace(/Mossling/g, () => PN()); const d = $('dialog'), el = $('dtext');
  $('dname').textContent = PN(); clearTimeout(say.h); clearInterval(say.i); d.classList.add('on'); el.textContent = ''; let i = 0;
  say.i = setInterval(() => { el.textContent = t.slice(0,++i); if(i>=t.length){ clearInterval(say.i); say.h = setTimeout(() => d.classList.remove('on'), 4200); } }, 28);
}
$('dialog').onclick = () => { clearInterval(say.i); clearTimeout(say.h); $('dialog').classList.remove('on'); };
function mood(){
  const n = S.name || 'friend'; if(S.dead) return ['...'];
  if(S.sick) return [`I don't feel so good, ${n}...`,'*cough* Finish a task and I\'ll feel better.','Don\'t worry about me. Go get your work done.'];
  if(S.food<30) return ['My tummy is rumbling...',`Any snacks, ${n}?`,'Finishing a task would feed me!'];
  const c = care(), L = [`I believe in you, ${n}!`,'The fireflies are pretty tonight.','Study buddy reporting in!',`I'm so glad you're here, ${n}.`];
  if(S.lastTask) L.push(`Nice work on "${S.lastTask}"!`);
  if(c.total && !c.met) L.push(`Only ${c.need} more task${c.need>1?'s':''} to hit today's goal. You can do it!`);
  if(S.streak>1) L.push(`${S.streak} days in a row! You're amazing.`);
  return L;
}

// ---- Friendship ----
function addBond(n){
  const b0 = Math.min(5,Math.floor((S.bond||0)/10)); S.bond = Math.min(60,(S.bond||0)+n); const b1 = Math.min(5,Math.floor(S.bond/10));
  if(b1>b0){ S.dew += 15; setEx('excited',4000); hearts(8); toast(`❤️ Friendship Lv.${b1}! Mossling loves you more. +15 dew drops`); say(pick([`${S.name}, you're my favorite person!`,'I feel so safe with you.','Let\'s keep doing this together!'])); }
}
let lastPat = 0; function petBond(){ if(Date.now()-lastPat>4000){ lastPat = Date.now(); addBond(1); } }
function greet(first){
  if(S.dead) return; const n = S.name;
  if(first){ setEx('excited',5000); hop(); hearts(6); say(`Hi ${n}! I'm ${PN()}. Finish tasks to feed me and I'll keep you company.`); return; }
  if(S.sick){ say(`Oh... ${n}, you're back. I'm not feeling well. Could you finish a task?`); return; }
  setEx('excited',5000); hop(); setTimeout(hop,700); setTimeout(hop,1400); hearts(6);
  say(S.streak>1 ? `${n}! Day ${S.streak} together! I missed you!` : `${n}! You came back! I missed you so much!`);
}

// ---- Wandering and idle poses ----
const POSES = [['wiggle',900],['stretch',1300],['bounce',1600],['spin',900],['nap',4500]];
function wander(){
  if(!$('game').classList.contains('show') || pg || S.dead || S.sick) return;
  const st = $('stage');
  if(Math.random()<.6){
    const sw = st.offsetWidth, lo = 72*sw/innerWidth+3, hi = Math.max(lo+4, 97-72*sw/innerWidth), x = lo+Math.random()*(hi-lo), y = Math.random(), cur = parseFloat(st.style.left)||50, dur = Math.max(1.6, Math.abs(x-cur)/10);
    st.style.setProperty('--mt', dur+'s'); st.style.setProperty('--sc', 1+y*.12); st.style.left = x+'%'; st.style.bottom = `calc(var(--base) - ${Math.round(y*50)}px)`;
    $('body').style.transform = `scaleX(${x<cur?-1:1})`;
    const p = $('pet'); p.classList.add('walk'); setTimeout(() => p.classList.remove('walk'), dur*1000);
  } else { const [n,ms] = pick(POSES); if(n==='nap') setEx('sleepy',ms); else { const p = $('pet'); p.classList.add('p-'+n); setTimeout(() => p.classList.remove('p-'+n), ms); } }
}
setInterval(wander, 5500);
$('pname').onclick = () => openPage('set');

// ---- Login ----
function start(){
  $('login').classList.add('leave');
  setTimeout(() => { $('login').style.display = 'none'; const g = $('game'); g.style.display = 'block'; render(); requestAnimationFrame(() => g.classList.add('show')); }, 800);
}
$('enter').onclick = () => {
  const n = $('nm').value.trim();
  if(!n || !$('pn').value){ $('lmsg').textContent = 'Fill in your name and a secret word.'; return; }
  S.name = n; S.pname = ($('pnm').value.trim()||S.pname||'Mossling').slice(0,14); const first = S.lastDay==null; const cm = checkIn(); if(!S.mute) startMusic(); save(); start(); setTimeout(() => { cm && toast(cm); greet(first); }, 1300);
};
['nm','pn'].forEach(id => $(id).onkeydown = e => { if(e.key==='Enter') $('enter').click(); });
const tick = () => { const d = new Date(); $('ct').textContent = d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); $('cd').textContent = d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'}); };
tick(); setInterval(tick,1000);
setInterval(() => { if(document.body.dataset.phase !== phase()) paintBG(); }, 60000);
function padRender(){ const t = dayNum(), a = S.tasks.filter(x => (x.day??t)===t).slice(0,5);
  $('padl').innerHTML = a.length ? a.map(x => `<li class="${x.done?'d':''}">${esc(x.text)}</li>`).join('') : '<li class="e">nothing yet...</li>'; }
$('pad').onclick = () => openPage('tasks');
function graveRender(){ const g = $('grave'), d = !!S.dead; if(d && !g.classList.contains('open')){ $('gp').innerHTML = $('pet').innerHTML; $('gsub').textContent = `Faded away. Best streak: ${S.best||0} day${S.best==1?'':'s'}.`; } g.classList.toggle('open', d); }
addEventListener('pointerdown', e => { boost = 1; MX = e.clientX; MY = e.clientY; cur.classList.add('boost'); setTimeout(() => cur.classList.remove('boost'), 650);
  for(let i=0;i<9;i++){ const d = document.createElement('div'); d.className = 'trail'; d.style.left = e.clientX+(Math.random()*60-30)+'px'; d.style.top = e.clientY+(Math.random()*60-30)+'px'; document.body.appendChild(d); setTimeout(() => d.remove(), 800); } });
(function(){ const L = $('leaves'), rnd = (a,b) => a+Math.random()*(b-a);
  const GR = [['#2f6a45','#3f7a4a','#58a05a'],['#3a7a4e','#4f9a5a','#7fc46a'],['#2b5f55','#3f8a6a','#6fb58a']];
  function tree(side,h,w,off,z,fl){
    const g = GR[Math.random()*3|0], el = document.createElement('div'); el.className = 'tree';
    el.style.cssText = `${side}:${off}px;height:${h}vh;width:${w}px;z-index:${z};${fl?'transform:scaleX(-1)':''}`;
    let cl = '', lights = '', sh = '';
    [[100,120,78,0],[52,150,60,1],[148,150,60,2],[100,70,66,1],[70,95,52,2],[132,98,54,0],[100,36,46,2]].forEach(([x,y,r,c],i) => {
      cl += `<g class="can" style="animation-delay:${i*.05}s"><circle cx="${x}" cy="${y}" r="${r}" fill="${g[c]}"/><circle cx="${x-r*.3}" cy="${y-r*.3}" r="${r*.45}" fill="#fff" opacity=".07"/>`
        + `<path d="M${x-r*.5} ${y+r*.2}q${r*.3} ${r*.25} ${r*.6} 0" stroke="#17301f" stroke-opacity=".25" stroke-width="3" fill="none"/></g>`; });
    for(let i=0;i<9;i++){ const x = rnd(30,170), y = rnd(60,190); lights += `<circle class="bulb" cx="${x}" cy="${y}" r="4.5" fill="#ffe98a" style="animation-delay:${rnd(0,3).toFixed(2)}s"/>`; }
    for(let i=0;i<5;i++) sh += `<circle cx="${rnd(20,180)}" cy="${rnd(300,395)}" r="4" fill="${['#e58a8a','#f3e9d2','#9ad0ff','#ffd45a'][i%4]}"/>`;
    el.innerHTML = `<svg viewBox="0 0 200 420" preserveAspectRatio="xMidYMax meet">`
      + `<path d="M84 420C92 340 88 280 90 210 78 190 60 170 46 160M110 210c0 70 6 140 18 210M92 230C112 200 140 180 156 160" stroke="#4a3426" stroke-width="2" fill="none"/>`
      + `<path d="M70 420C86 360 84 300 88 200h26c4 100 2 160 22 220z" fill="#5a4030"/><path d="M96 410C98 340 96 280 98 210" stroke="#3d2a1e" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M104 390c2-50 0-90 2-150" stroke="#7a5a42" stroke-width="2" fill="none"/>`
      + `<ellipse cx="100" cy="418" rx="78" ry="12" fill="#2f6a45"/>${cl}${lights}${sh}`
      + `<g><path d="M30 418v-16" stroke="#f3e9d2" stroke-width="5"/><path d="M18 404a14 12 0 0 1 28 0z" fill="#d9534f"/><circle cx="26" cy="400" r="2" fill="#fff"/><circle cx="36" cy="398" r="2" fill="#fff"/></g>`
      + `<g><path d="M166 418v-11" stroke="#f3e9d2" stroke-width="4"/><path d="M157 409a10 8 0 0 1 20 0z" fill="#e58a8a"/><circle cx="162" cy="406" r="1.6" fill="#fff"/></g></svg>`;
    L.appendChild(el); }
  tree('left',92,330,-110,0,0); tree('left',62,230,150,0,1); tree('right',92,330,-110,0,1); tree('right',60,220,160,0,0);
  const sw = document.createElement('div'); sw.className = 'sway'; L.appendChild(sw); })();
load(); if(S.name) $('nm').value = S.name; if(S.pname) $('pnm').value = S.pname;
initPet(); paintBG(); let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(paintBG, 300); });
</script>
</body>
